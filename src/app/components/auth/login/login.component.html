<div class="d-flex flex-row h-nonav ovrf">
    <div class="col-12 col-lg-5 container h-100">

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form c-flex-col h-100 gap-4">
            <h1>Iniciar Sesión</h1>

            <div class="form-group w-100">
                <input placeholder="Usuario" type="text" id="username" formControlName="username" class="form-control"
                    [class.is-invalid]="
              loginForm.get('username')?.invalid &&
              loginForm.get('username')?.touched
            " />
                <div class="invalid-feedback"
                    *ngIf="loginForm.get('username')?.errors?.['required'] && loginForm.get('username')?.touched">
                    El usuario es requerido
                </div>
            </div>

            <div class="form-group w-100">
                <input type="password" id="password" formControlName="password" class="form-control" [class.is-invalid]="
              loginForm.get('password')?.invalid &&
              loginForm.get('password')?.touched
            " placeholder="Contraseña" />
                <div class="invalid-feedback"
                    *ngIf="loginForm.get('password')?.errors?.['required'] && loginForm.get('password')?.touched">
                    La contraseña es requerida
                </div>
                <div class="invalid-feedback"
                    *ngIf="loginForm.get('password')?.errors?.['minlength'] && loginForm.get('password')?.touched">
                    La contraseña debe tener al menos 6 caracteres
                </div>
            </div>

            <div class="alert alert-danger" *ngIf="error">
                {{ error }}
            </div>

            <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid || loading">
                <span class="spinner-border spinner-border-sm me-2" *ngIf="loading"></span>
                {{ loading ? "Iniciando sesión..." : "Iniciar Sesión" }}
            </button>
        </form>
    </div>

    <div class="col-7 h-100" id="imager">
        <img src="/office.jpg" class="login-image img-fluid h-100" />
    </div>
</div>
